<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <style>
      :root { color-scheme: dark; font-family: Inter, "PingFang SC", sans-serif; }
      body { margin: 0; padding: 16px; background: #1e1e1e; color: #f5f5f5; font-size: 12px; }
      h1 { font-size: 14px; margin: 0 0 4px; }
      p { color: #b3b3b3; margin: 0 0 14px; line-height: 1.5; }
      label { display: block; color: #b3b3b3; margin: 10px 0 6px; }
      .modes { display: flex; gap: 16px; margin-bottom: 6px; }
      .modes label { display: flex; align-items: center; gap: 6px; margin: 0; color: #ddd; }
      input[type="file"] { width: 100%; color: #ddd; }
      input[type="text"] { width: 100%; box-sizing: border-box; height: 36px; border-radius: 6px; border: 1px solid #444; background: #2c2c2c; color: #fff; font: inherit; padding: 0 8px; }
      textarea { width: 100%; box-sizing: border-box; min-height: 56px; resize: vertical; border-radius: 6px; border: 1px solid #444; background: #2c2c2c; color: #fff; font: inherit; padding: 8px; }
      select, button { width: 100%; height: 36px; border-radius: 6px; border: 1px solid #444; background: #2c2c2c; color: #fff; font: inherit; }
      button { margin-top: 12px; background: #fff; color: #111; border: 0; font-weight: 600; cursor: pointer; }
      button:disabled { opacity: .5; cursor: default; }
      button[hidden] { display: none; }
      #status { margin-top: 14px; padding: 10px; border-radius: 6px; background: #2a2a2a; color: #b3b3b3; line-height: 1.5; white-space: pre-wrap; }
      #status.error { background: #3a1f1f; color: #ffb4b4; }
      #status.ok { background: #1f3a2a; color: #b4ffd0; }
      #saveStatus { margin-top: 8px; color: #888; font-size: 11px; line-height: 1.5; white-space: pre-wrap; }
      #saveStatus.ok { color: #b4ffd0; }
      #saveStatus.error { color: #ffb4b4; }
      a { color: #9ecbff; }
      .muted { color: #888; font-size: 11px; }
    </style>
  </head>
  <body>
    <h1>PRD UI Figma Renderer</h1>
    <p>选择 <code>figma-plan.&lt;page&gt;.json</code>，先做 scratch build + readback；diff 通过后再 build delivery page。</p>
    <label for="plan">Plan file</label>
    <input id="plan" type="file" accept="application/json,.json" />
    <label for="planText">或粘贴 plan JSON</label>
    <textarea id="planText" rows="3" placeholder="粘贴 figma-plan.<page>.json 的内容"></textarea>
    <button id="loadText" disabled>Load plan JSON</button>
    <label for="planUrl">或从 localhost 加载</label>
    <input id="planUrl" type="text" placeholder="http://127.0.0.1:9600/plans/figma-plan.today.json" />
    <button id="loadUrl" disabled>Load plan URL</button>
    <label for="server">Save server（pnpm figma:serve）</label>
    <input id="server" type="text" value="http://127.0.0.1:9600" placeholder="http://127.0.0.1:9600" />
    <label>Build mode</label>
    <div class="modes">
      <label><input type="radio" name="mode" value="scratch" checked /> Scratch + readback</label>
      <label><input type="radio" name="mode" value="delivery" /> Delivery page</label>
    </div>
    <button id="build" disabled>Build</button>
    <div id="status">Ready. 选择 plan 后开始。</div>
    <div id="saveStatus">Auto-save: idle</div>
    <button id="copyReadback" hidden>Copy readback JSON</button>
    <p class="muted">插件不能 headless；delivery page 已存在时会阻止。readback/PNG 自动保存到 Save server，也可下载后交给 <code>pnpm figma:verify</code>。</p>
    <script>
      const input = document.getElementById("plan");
      const planText = document.getElementById("planText");
      const loadText = document.getElementById("loadText");
      const planUrl = document.getElementById("planUrl");
      const loadUrl = document.getElementById("loadUrl");
      const build = document.getElementById("build");
      const status = document.getElementById("status");
      const saveStatus = document.getElementById("saveStatus");
      const server = document.getElementById("server");
      const copyReadback = document.getElementById("copyReadback");
      let plan = null;
      let lastReadback = null;
      const saveLines = [];

      function setStatus(text, kind) {
        status.textContent = text;
        status.className = kind || "";
      }

      function noteSave(text, kind) {
        saveLines.push(text);
        if (saveLines.length > 3) saveLines.shift();
        saveStatus.textContent = saveLines.join("\n");
        saveStatus.className = kind || "";
      }

      async function postToServer(path, body, headers) {
        const base = server.value.trim().replace(/\/+$/, "");
        if (!base) {
          noteSave("Auto-save skipped: no Save server URL");
          return false;
        }
        try {
          const response = await fetch(`${base}${path}`, { method: "POST", headers, body });
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          noteSave(`Auto-saved ${path}`, "ok");
          return true;
        } catch (error) {
          noteSave(`Auto-save failed ${path}: ${error.message}（可下载/复制回退）`, "error");
          return false;
        }
      }

      function acceptPlan(value, source) {
        plan = value;
        build.disabled = false;
        copyReadback.hidden = true;
        lastReadback = null;
        setStatus(`已加载 ${plan.pageId || plan.pageName || source}`);
      }

      input.addEventListener("change", async () => {
        const file = input.files && input.files[0];
        if (!file) return;
        try {
          acceptPlan(JSON.parse(await file.text()), file.name);
        } catch (error) {
          plan = null;
          build.disabled = true;
          setStatus(`Plan 解析失败：${error.message}`, "error");
        }
      });

      planText.addEventListener("input", () => {
        loadText.disabled = planText.value.trim() === "";
      });

      loadText.addEventListener("click", () => {
        try {
          acceptPlan(JSON.parse(planText.value), "粘贴内容");
        } catch (error) {
          plan = null;
          build.disabled = true;
          setStatus(`Plan 解析失败：${error.message}`, "error");
        }
      });

      planUrl.addEventListener("input", () => {
        loadUrl.disabled = planUrl.value.trim() === "";
      });

      loadUrl.addEventListener("click", async () => {
        const url = planUrl.value.trim();
        try {
          const response = await fetch(url);
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          acceptPlan(await response.json(), url);
        } catch (error) {
          plan = null;
          build.disabled = true;
          setStatus(`Plan 加载失败：${error.message}`, "error");
        }
      });

      copyReadback.addEventListener("click", async () => {
        if (lastReadback === null) return;
        const text = JSON.stringify(lastReadback, null, 2);
        try {
          await navigator.clipboard.writeText(text);
        } catch {
          const scratch = document.createElement("textarea");
          scratch.value = text;
          document.body.append(scratch);
          scratch.select();
          document.execCommand("copy");
          scratch.remove();
        }
        setStatus(`readback 已复制：${lastReadback.pageId}`, "ok");
      });

      build.addEventListener("click", () => {
        if (!plan) return;
        build.disabled = true;
        setStatus("Building…");
        const selected = document.querySelector('input[name="mode"]:checked');
        parent.postMessage(
          { pluginMessage: { type: "build", plan, mode: selected ? selected.value : "scratch" } },
          "*"
        );
      });

      window.onmessage = (event) => {
        const message = event.data.pluginMessage;
        if (!message) return;
        if (message.type === "status") {
          setStatus(message.message || "Working…");
          return;
        }
        if (message.type === "error") {
          build.disabled = false;
          setStatus(`构建失败：${message.message}`, "error");
          return;
        }
        if (message.type === "readback") {
          build.disabled = false;
          const readback = message.readback;
          lastReadback = readback;
          copyReadback.hidden = false;
          const text = JSON.stringify(readback, null, 2);
          const blob = new Blob([text], { type: "application/json" });
          const url = URL.createObjectURL(blob);
          status.className = "ok";
          status.innerHTML = "";
          const lines = [
            `Built ${readback.pageId}`,
            `${readback.fonts.length} fonts, ${readback.variables.length} variables, ${readback.textStyles.length} text styles`,
            readback.errors.length > 0 ? `errors: ${readback.errors.join("; ")}` : "no plugin errors",
          ];
          for (const line of lines) {
            const div = document.createElement("div");
            div.textContent = line;
            status.append(div);
          }
          const link = document.createElement("a");
          link.href = url;
          link.download = `figma-readback.${readback.pageId}.json`;
          link.textContent = "下载 readback JSON";
          status.append(link);
          void postToServer(
            `/save/figma-readback.${readback.pageId}.json`,
            text,
            { "content-type": "application/json" }
          );
        }
        if (message.type === "png") {
          const bytes = new Uint8Array(message.bytes);
          const url = URL.createObjectURL(new Blob([bytes], { type: "image/png" }));
          const link = document.createElement("a");
          link.href = url;
          link.download = `figma.${message.pageId}.png`;
          link.textContent = "下载 PNG";
          const row = document.createElement("div");
          row.append(link);
          status.append(row);
          void postToServer(`/save/figma.${message.pageId}.png`, bytes);
        }
      };
    </script>
  </body>
</html>
