# Project-local dsh profile for the PRD → UI asset reviewer.
# This profile never modifies ~/.dsh; the dsh CLI is pointed at this home via
# DSH_HOME and the profile is selected with --profile prd-ui-assets.

- insert:
    - id: llm-pi-ai
      name: '@deepseek-ai/dsh-llm-pi-ai'
      config:
        providers:
          prd-ui-vision:
            displayName: PRD UI Vision
            apiKeyEnv: PRD_UI_VISION_API_KEY
            api: openai-completions
            baseURL: !!js process.env.PRD_UI_VISION_BASE_URL ?? 'https://api.openai.com/v1'
            defaultInput: [text, image]
            models:
              - id: !!js process.env.PRD_UI_VISION_MODEL ?? 'gpt-4o-mini'
                name: PRD UI Vision
                contextWindow: 128000
                maxTokens: 8192

- id: agent-default-model
  config:
    provider: prd-ui-vision
    model: !!js process.env.PRD_UI_VISION_MODEL ?? 'gpt-4o-mini'

- insert:
    - id: prd-ui-assets
      name: '@prd-ui/runtime-dsh'
