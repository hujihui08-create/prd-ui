# Project-local dsh profile for the Visual Critic.
# The critic needs a vision model (screenshots are read with read_image) and the
# read side of tool-fs. write/edit tools, shells, workflow/PTC, subagent tools,
# and web tools are disabled below; the sandbox policy is read-only. Reads are
# not confined by dsh's fs sandbox, so the residual read surface is `read`,
# `read_image`, `glob`/`grep`, and skill reads over the process's filesystem.
# This profile never modifies ~/.dsh; DSH_HOME points here and --profile
# prd-ui-visual selects it.

- insert:
    - id: llm-pi-ai
      name: '@deepseek-ai/dsh-llm-pi-ai'
      config:
        providers:
          prd-ui-vision:
            displayName: PRD UI Vision
            apiKeyEnv: PRD_UI_VISION_API_KEY
            api: openai-completions
            baseURL: !!js process.env.PRD_UI_VISION_BASE_URL
            defaultInput: [text, image]
            models:
              - id: !!js process.env.PRD_UI_VISION_MODEL
                name: PRD UI Vision
                contextWindow: 128000
                maxTokens: 32768

- id: agent-default-model
  config:
    provider: prd-ui-vision
    model: !!js process.env.PRD_UI_VISION_MODEL

# The critic only reads screenshots and Page Spec data. Remove every mutating,
# orchestration, delegation, and network surface from the base bundle.
- id: tool-fs
  config:
    write: false
    edit: false
- id: tool-bash
  disabled: true
- id: tool-pwsh
  disabled: true
- id: tool-workflow
  disabled: true
- id: workflow-ptc
  disabled: true
- id: ptc-runtime
  disabled: true
- id: tool-subagent
  disabled: true
- id: tool-subagent-fork
  disabled: true
- id: tool-subagent-control
  disabled: true
- id: tool-subagent-list-agents
  disabled: true
- id: tool-web
  disabled: true
- id: web
  disabled: true
- id: web-search-deepseek
  disabled: true
- id: web-deepseek-api
  disabled: true
- id: web-fetch-http
  disabled: true
- id: sandbox-policy
  config:
    mode: read-only
