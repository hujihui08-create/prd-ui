<html lang="zh-CN">

<title>布谷鑫声 · 图标预览</title>
<style>
  :root {
    --background: #ffffff;
    --foreground: #1f2937;
    --muted-foreground: #6b7280;
    --border: #e5e7eb;
    --font-size-base: 16px;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --background: #0f1215;
      --foreground: #f2f4f5;
      --muted-foreground: #9aa3ad;
      --border: #2a2f36;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: clamp(20px, 4vw, 40px);
    background: var(--background);
    color: var(--foreground);
    font-family: "Noto Sans SC", "PingFang SC", system-ui, sans-serif;
  }
  h1 { font-size: clamp(24px, 4vw, 32px); line-height: 1.2; font-weight: 500; }
  .text-small { font-size: 12px; }
</style>
</head>

<div id="bgxs-icon-viz">
  <style>
    #bgxs-icon-viz {
      color: var(--foreground);
      font-family: "Noto Sans SC", "PingFang SC", system-ui, -apple-system, sans-serif;
      max-width: 880px;
      margin: 0 auto;
      padding: 6px 0 2px;
    }
    #bgxs-icon-viz .masthead {
      display: flex;
      align-items: center;
      gap: 20px;
      flex-wrap: wrap;
    }
    #bgxs-icon-viz .app-icon {
      border-radius: 22.5%;
      overflow: hidden;
      flex: none;
    }
    #bgxs-icon-viz .app-icon svg {
      display: block;
      width: 100%;
      height: 100%;
    }
    #bgxs-icon-viz .hero-icon {
      width: 88px;
      height: 88px;
      box-shadow: 0 10px 28px color-mix(in srgb, var(--foreground) 15%, transparent);
    }
    #bgxs-icon-viz h1 {
      margin: 0;
    }
    #bgxs-icon-viz .meta {
      display: flex;
      align-items: center;
      gap: 9px;
      flex-wrap: wrap;
      margin-top: 5px;
      color: var(--muted-foreground);
    }
    #bgxs-icon-viz .dot {
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: currentColor;
      opacity: .55;
    }
    #bgxs-icon-viz .section {
      margin-top: 26px;
    }
    #bgxs-icon-viz .section-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 14px;
      color: var(--muted-foreground);
    }
    #bgxs-icon-viz .showcase {
      display: flex;
      gap: 26px;
      flex-wrap: wrap;
    }
    #bgxs-icon-viz .variant {
      flex: 1 1 250px;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 11px;
      align-items: flex-start;
    }
    #bgxs-icon-viz .variant .app-icon {
      width: min(100%, 286px);
      aspect-ratio: 1;
      box-shadow: 0 14px 38px color-mix(in srgb, var(--foreground) 13%, transparent);
    }
    #bgxs-icon-viz .label {
      display: flex;
      align-items: baseline;
      gap: 9px;
      flex-wrap: wrap;
    }
    #bgxs-icon-viz .label strong {
      font-weight: 500;
    }
    #bgxs-icon-viz .sizes {
      display: flex;
      align-items: flex-end;
      gap: 24px;
      flex-wrap: wrap;
      padding: 2px 0;
    }
    #bgxs-icon-viz .size {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      color: var(--muted-foreground);
    }
    #bgxs-icon-viz .size .app-icon {
      box-shadow: 0 6px 18px color-mix(in srgb, var(--foreground) 12%, transparent);
    }
    #bgxs-icon-viz .size[data-px="128"] .app-icon { width: 128px; height: 128px; }
    #bgxs-icon-viz .size[data-px="64"] .app-icon { width: 64px; height: 64px; }
    #bgxs-icon-viz .size[data-px="32"] .app-icon { width: 32px; height: 32px; border-radius: 22.5%; }
    #bgxs-icon-viz .swatches {
      display: flex;
      gap: 22px;
      flex-wrap: wrap;
    }
    #bgxs-icon-viz .swatch {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--muted-foreground);
    }
    #bgxs-icon-viz .chip {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--foreground) 16%, transparent);
    }
    #bgxs-icon-viz .hex {
      font-variant-numeric: tabular-nums;
    }
    #bgxs-icon-viz hr {
      border: 0;
      border-top: 1px solid var(--border);
      margin: 26px 0 0;
    }
    @media (max-width: 560px) {
      #bgxs-icon-viz .showcase { gap: 22px; }
      #bgxs-icon-viz .variant { flex-basis: 100%; }
      #bgxs-icon-viz .sizes { gap: 18px; }
    }
